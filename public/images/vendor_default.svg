<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <rect width="400" height="200" fill="url(#shine)"/>

  <!-- Grooming brush (left) -->
  <rect x="52" y="70" width="30" height="60" rx="8" fill="#7c3aed"/>
  <rect x="46" y="124" width="42" height="20" rx="6" fill="#6d28d9"/>
  <!-- Brush bristles -->
  <line x1="54" y1="128" x2="54" y2="142" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="61" y1="128" x2="61" y2="144" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="128" x2="68" y2="142" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="128" x2="75" y2="144" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="128" x2="82" y2="142" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Brush handle grip lines -->
  <line x1="52" y1="84" x2="82" y2="84" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <line x1="52" y1="92" x2="82" y2="92" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <!-- Dog being brushed (center) -->
  <ellipse cx="200" cy="150" rx="58" ry="34" fill="#fcd34d"/>
  <rect x="184" y="124" width="30" height="30" rx="14" fill="#fcd34d"/>
  <circle cx="199" cy="106" r="38" fill="#fcd34d"/>
  <!-- Ears -->
  <ellipse cx="164" cy="118" rx="16" ry="26" fill="#f59e0b" transform="rotate(-10 164 118)"/>
  <ellipse cx="234" cy="118" rx="16" ry="26" fill="#f59e0b" transform="rotate(10 234 118)"/>
  <ellipse cx="164" cy="118" rx="10" ry="17" fill="#fde68a" transform="rotate(-10 164 118)"/>
  <ellipse cx="234" cy="118" rx="10" ry="17" fill="#fde68a" transform="rotate(10 234 118)"/>
  <!-- Eyes (happy) -->
  <path d="M183 100 Q189 95 195 100" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M203 100 Q209 95 215 100" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="199" cy="112" rx="7" ry="5" fill="#1c1917"/>
  <!-- Happy smile -->
  <path d="M189 119 Q199 128 209 119" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="199" cy="127" rx="5" ry="4" fill="#f9a8d4"/>
  <!-- Rosy cheeks -->
  <ellipse cx="180" cy="116" rx="9" ry="6" fill="#fca5a5" opacity="0.4"/>
  <ellipse cx="218" cy="116" rx="9" ry="6" fill="#fca5a5" opacity="0.4"/>

  <!-- Scissors (right) -->
  <line x1="308" y1="62" x2="360" y2="128" stroke="#7c3aed" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="308" y1="128" x2="360" y2="62" stroke="#7c3aed" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="334" cy="95" r="9" fill="#6d28d9"/>
  <circle cx="334" cy="95" r="4.5" fill="#ede9fe"/>
  <circle cx="308" cy="62" r="12" fill="none" stroke="#7c3aed" stroke-width="4.5"/>
  <circle cx="308" cy="128" r="12" fill="none" stroke="#7c3aed" stroke-width="4.5"/>

  <!-- Sparkle dots -->
  <circle cx="110" cy="62" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle cx="290" cy="58" r="3.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="96" cy="150" r="3" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="306" cy="155" r="3" fill="#c4b5fd" opacity="0.5"/>

  <text x="200" y="194" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6d28d9" opacity="0.65" font-weight="700" letter-spacing="1">GROOMING SPA</text>
</svg>
