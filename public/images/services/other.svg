<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- === DOG (left) === -->
  <!-- Dog body -->
  <ellipse cx="128" cy="156" rx="44" ry="30" fill="#fcd34d"/>
  <!-- Tail wagging up -->
  <path d="M170 148 Q195 120 180 108" stroke="#f59e0b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="114" y="132" width="26" height="26" rx="12" fill="#fcd34d"/>
  <!-- Dog head -->
  <circle cx="127" cy="108" r="34" fill="#fcd34d"/>
  <!-- Ears -->
  <ellipse cx="96" cy="118" rx="14" ry="22" fill="#f59e0b" transform="rotate(-8 96 118)"/>
  <ellipse cx="158" cy="118" rx="14" ry="22" fill="#f59e0b" transform="rotate(8 158 118)"/>
  <ellipse cx="96" cy="118" rx="9" ry="15" fill="#fde68a" transform="rotate(-8 96 118)"/>
  <ellipse cx="158" cy="118" rx="9" ry="15" fill="#fde68a" transform="rotate(8 158 118)"/>
  <!-- Dog eyes -->
  <circle cx="116" cy="101" r="5.5" fill="#1c1917"/>
  <circle cx="138" cy="101" r="5.5" fill="#1c1917"/>
  <circle cx="117.5" cy="99.5" r="2" fill="white"/>
  <circle cx="139.5" cy="99.5" r="2" fill="white"/>
  <!-- Dog nose -->
  <ellipse cx="127" cy="112" rx="6" ry="4.5" fill="#1c1917"/>
  <!-- Dog happy mouth + tongue -->
  <path d="M120 118 Q127 125 134 118" stroke="#1c1917" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="127" cy="124" rx="4.5" ry="3.5" fill="#f9a8d4"/>

  <!-- === CAT (right) === -->
  <!-- Cat body -->
  <ellipse cx="272" cy="158" rx="40" ry="28" fill="#fed7aa"/>
  <!-- Cat tail curled -->
  <path d="M310 150 Q340 130 332 108 Q326 94 316 102" stroke="#f97316" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="258" y="134" width="24" height="26" rx="10" fill="#fed7aa"/>
  <!-- Cat head -->
  <circle cx="270" cy="110" r="32" fill="#fed7aa"/>
  <!-- Cat ears (pointy) -->
  <polygon points="248,88 240,62 262,80" fill="#f97316"/>
  <polygon points="250,88 243,66 263,82" fill="#fca5a5" opacity="0.6"/>
  <polygon points="292,88 300,62 278,80" fill="#f97316"/>
  <polygon points="290,88 297,66 277,82" fill="#fca5a5" opacity="0.6"/>
  <!-- Cat eyes (almond shape) -->
  <ellipse cx="258" cy="104" rx="8" ry="6" fill="#1c1917"/>
  <ellipse cx="282" cy="104" rx="8" ry="6" fill="#1c1917"/>
  <!-- Pupils (vertical slit) -->
  <ellipse cx="258" cy="104" rx="2.5" ry="5" fill="#16a34a"/>
  <ellipse cx="282" cy="104" rx="2.5" ry="5" fill="#16a34a"/>
  <ellipse cx="258" cy="104" rx="1" ry="4" fill="#1c1917"/>
  <ellipse cx="282" cy="104" rx="1" ry="4" fill="#1c1917"/>
  <circle cx="259" cy="102" r="1.5" fill="white"/>
  <circle cx="283" cy="102" r="1.5" fill="white"/>
  <!-- Cat nose -->
  <polygon points="270,114 266,118 274,118" fill="#f9a8d4"/>
  <!-- Cat mouth -->
  <path d="M264 119 Q270 124 276 119" stroke="#1c1917" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="244" y1="114" x2="262" y2="116" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="244" y1="118" x2="262" y2="118" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="244" y1="122" x2="262" y2="120" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="296" y1="114" x2="278" y2="116" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="296" y1="118" x2="278" y2="118" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="296" y1="122" x2="278" y2="120" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Heart between them -->
  <path d="M200 94 C200 90 194 84 194 90 C194 96 200 102 200 102 C200 102 206 96 206 90 C206 84 200 90 200 94 Z" fill="#f43f5e" opacity="0.75"/>

  <text x="200" y="194" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6d28d9" opacity="0.6" font-weight="700" letter-spacing="1">OTHER SERVICES</text>
</svg>
