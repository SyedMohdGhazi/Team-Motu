<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Bathtub -->
  <rect x="62" y="118" width="276" height="58" rx="12" fill="white" stroke="#c4b5fd" stroke-width="2.5"/>
  <rect x="62" y="146" width="276" height="32" rx="8" fill="#bfdbfe" opacity="0.45"/>
  <rect x="60" y="114" width="280" height="12" rx="6" fill="white" stroke="#c4b5fd" stroke-width="2"/>
  <!-- Legs -->
  <rect x="90" y="174" width="14" height="20" rx="6" fill="#c4b5fd"/>
  <rect x="296" y="174" width="14" height="20" rx="6" fill="#c4b5fd"/>
  <!-- Faucet -->
  <rect x="192" y="92" width="16" height="30" rx="7" fill="#a78bfa"/>
  <rect x="180" y="88" width="40" height="12" rx="6" fill="#a78bfa"/>
  <ellipse cx="200" cy="124" rx="3" ry="5" fill="#93c5fd" opacity="0.75"/>

  <!-- Dog head peeking from tub -->
  <circle cx="200" cy="106" r="34" fill="#fcd34d"/>
  <!-- Floppy ears -->
  <ellipse cx="167" cy="118" rx="15" ry="24" fill="#f59e0b" transform="rotate(-10 167 118)"/>
  <ellipse cx="233" cy="118" rx="15" ry="24" fill="#f59e0b" transform="rotate(10 233 118)"/>
  <ellipse cx="167" cy="118" rx="9" ry="16" fill="#fde68a" transform="rotate(-10 167 118)"/>
  <ellipse cx="233" cy="118" rx="9" ry="16" fill="#fde68a" transform="rotate(10 233 118)"/>
  <!-- Eyes -->
  <circle cx="187" cy="99" r="5.5" fill="#1c1917"/>
  <circle cx="213" cy="99" r="5.5" fill="#1c1917"/>
  <circle cx="188.5" cy="97.5" r="2" fill="white"/>
  <circle cx="214.5" cy="97.5" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="110" rx="6" ry="4.5" fill="#1c1917"/>
  <!-- Mouth + tongue -->
  <path d="M193 116 Q200 123 207 116" stroke="#1c1917" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="200" cy="122" rx="5" ry="4" fill="#f9a8d4"/>
  <line x1="200" y1="119" x2="200" y2="125" stroke="#f472b6" stroke-width="1.2"/>

  <!-- Bubbles -->
  <circle cx="143" cy="92" r="10" fill="white" opacity="0.72"/>
  <circle cx="130" cy="74" r="6.5" fill="white" opacity="0.56"/>
  <circle cx="153" cy="77" r="8" fill="white" opacity="0.62"/>
  <circle cx="258" cy="88" r="11" fill="white" opacity="0.72"/>
  <circle cx="273" cy="70" r="6.5" fill="white" opacity="0.56"/>
  <circle cx="247" cy="74" r="8" fill="white" opacity="0.62"/>
  <circle cx="118" cy="108" r="5.5" fill="white" opacity="0.5"/>
  <circle cx="282" cy="106" r="5.5" fill="white" opacity="0.5"/>

  <text x="200" y="194" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6d28d9" opacity="0.6" font-weight="700" letter-spacing="1">BATH &amp; SPA</text>
</svg>
