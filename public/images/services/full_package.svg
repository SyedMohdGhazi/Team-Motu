<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- Soft glow behind dog -->
  <ellipse cx="200" cy="110" rx="90" ry="80" fill="url(#glow)"/>

  <!-- Crown -->
  <polygon points="168,62 176,46 184,58 192,38 200,56 208,38 216,58 224,46 232,62" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="168" y="60" width="64" height="10" rx="4" fill="#fbbf24"/>
  <!-- Crown gems -->
  <circle cx="184" cy="62" r="4" fill="#f43f5e"/>
  <circle cx="200" cy="62" r="4" fill="#34d399"/>
  <circle cx="216" cy="62" r="4" fill="#60a5fa"/>

  <!-- Dog body -->
  <ellipse cx="200" cy="162" rx="52" ry="30" fill="#fcd34d"/>
  <!-- Neck -->
  <rect x="186" y="138" width="28" height="28" rx="12" fill="#fcd34d"/>
  <!-- Bow tie -->
  <polygon points="186,152 200,158 186,164" fill="#f43f5e"/>
  <polygon points="214,152 200,158 214,164" fill="#f43f5e"/>
  <circle cx="200" cy="158" r="5" fill="#dc2626"/>
  <!-- Dog head -->
  <circle cx="200" cy="112" r="36" fill="#fcd34d"/>
  <!-- Floppy ears -->
  <ellipse cx="167" cy="124" rx="15" ry="24" fill="#f59e0b" transform="rotate(-10 167 124)"/>
  <ellipse cx="233" cy="124" rx="15" ry="24" fill="#f59e0b" transform="rotate(10 233 124)"/>
  <ellipse cx="167" cy="124" rx="9" ry="16" fill="#fde68a" transform="rotate(-10 167 124)"/>
  <ellipse cx="233" cy="124" rx="9" ry="16" fill="#fde68a" transform="rotate(10 233 124)"/>
  <!-- Eyes (happy/squinting) -->
  <path d="M182 105 Q188 100 194 105" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M206 105 Q212 100 218 105" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="200" cy="118" rx="7" ry="5" fill="#1c1917"/>
  <!-- Big smile -->
  <path d="M188 125 Q200 136 212 125" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="180" cy="122" rx="9" ry="6" fill="#fca5a5" opacity="0.45"/>
  <ellipse cx="220" cy="122" rx="9" ry="6" fill="#fca5a5" opacity="0.45"/>

  <!-- Sparkles -->
  <path d="M60 50 L62 60 L72 62 L62 64 L60 74 L58 64 L48 62 L58 60 Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M330 44 L332 52 L340 54 L332 56 L330 64 L328 56 L320 54 L328 52 Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M50 130 L51.5 136 L58 137.5 L51.5 139 L50 145 L48.5 139 L42 137.5 L48.5 136 Z" fill="#a78bfa" opacity="0.6"/>
  <path d="M342 128 L343.5 134 L350 135.5 L343.5 137 L342 143 L340.5 137 L334 135.5 L340.5 134 Z" fill="#a78bfa" opacity="0.6"/>
  <!-- Small stars -->
  <circle cx="85" cy="88" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="318" cy="92" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="72" cy="160" r="2.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="330" cy="160" r="2.5" fill="#c4b5fd" opacity="0.5"/>

  <text x="200" y="196" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#e9d5ff" opacity="0.75" font-weight="700" letter-spacing="1">FULL PACKAGE</text>
</svg>
