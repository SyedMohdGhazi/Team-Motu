<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Dog head -->
  <circle cx="185" cy="106" r="38" fill="#fcd34d"/>
  <!-- Left floppy ear (hanging) -->
  <ellipse cx="150" cy="120" rx="20" ry="34" fill="#f59e0b" transform="rotate(-5 150 120)"/>
  <ellipse cx="150" cy="120" rx="13" ry="23" fill="#fde68a" transform="rotate(-5 150 120)"/>
  <!-- Right ear (raised, showing ear canal area) -->
  <ellipse cx="222" cy="84" rx="17" ry="24" fill="#f59e0b" transform="rotate(22 222 84)"/>
  <ellipse cx="222" cy="84" rx="11" ry="16" fill="#fde68a" transform="rotate(22 222 84)"/>
  <!-- Inner ear canal hint -->
  <ellipse cx="224" cy="90" rx="5" ry="7" fill="#fca5a5" opacity="0.5" transform="rotate(22 224 90)"/>

  <!-- Eyes -->
  <circle cx="172" cy="99" r="6" fill="#1c1917"/>
  <circle cx="198" cy="99" r="6" fill="#1c1917"/>
  <circle cx="173.5" cy="97.5" r="2.2" fill="white"/>
  <circle cx="199.5" cy="97.5" r="2.2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="185" cy="112" rx="7" ry="5" fill="#1c1917"/>
  <!-- Mouth -->
  <path d="M177 118 Q185 125 193 118" stroke="#1c1917" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cotton swab -->
  <!-- Stick -->
  <rect x="246" y="52" width="8" height="66" rx="4" fill="#d1d5db" transform="rotate(28 250 85)"/>
  <!-- Cotton tip top -->
  <ellipse cx="260" cy="48" rx="12" ry="12" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <ellipse cx="260" cy="48" rx="8" ry="8" fill="#f9fafb"/>
  <!-- Cotton tip bottom -->
  <ellipse cx="238" cy="118" rx="12" ry="12" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <ellipse cx="238" cy="118" rx="8" ry="8" fill="#f9fafb"/>

  <!-- Clean sparkle near ear -->
  <circle cx="244" cy="84" r="4" fill="#34d399" opacity="0.9"/>
  <line x1="244" y1="75" x2="244" y2="71" stroke="#34d399" stroke-width="2"/>
  <line x1="244" y1="93" x2="244" y2="97" stroke="#34d399" stroke-width="2"/>
  <line x1="235" y1="84" x2="231" y2="84" stroke="#34d399" stroke-width="2"/>
  <line x1="253" y1="84" x2="257" y2="84" stroke="#34d399" stroke-width="2"/>

  <text x="200" y="194" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6d28d9" opacity="0.6" font-weight="700" letter-spacing="1">EAR CLEANING</text>
</svg>
