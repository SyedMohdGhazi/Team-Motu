<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Dog paw - main pad -->
  <ellipse cx="148" cy="142" rx="46" ry="38" fill="#fcd34d"/>
  <ellipse cx="148" cy="142" rx="30" ry="24" fill="#f59e0b" opacity="0.28"/>
  <!-- Toe pads -->
  <ellipse cx="102" cy="106" rx="21" ry="18" fill="#fcd34d"/>
  <ellipse cx="134" cy="90" rx="21" ry="18" fill="#fcd34d"/>
  <ellipse cx="168" cy="90" rx="21" ry="18" fill="#fcd34d"/>
  <ellipse cx="198" cy="108" rx="21" ry="18" fill="#fcd34d"/>
  <!-- Nails -->
  <path d="M94 92 Q96 80 102 78 Q108 80 110 92" fill="#fb923c" opacity="0.8"/>
  <path d="M126 76 Q128 64 134 62 Q140 64 142 76" fill="#fb923c" opacity="0.65"/>
  <path d="M160 76 Q162 64 168 62 Q174 64 176 76" fill="#fb923c" opacity="0.65"/>
  <path d="M190 94 Q192 82 198 80 Q204 82 206 94" fill="#fb923c" opacity="0.65"/>

  <!-- Nail clippers (right side) -->
  <!-- Handle left -->
  <rect x="252" y="58" width="18" height="52" rx="9" fill="#7c3aed" transform="rotate(8 261 84)"/>
  <!-- Handle right -->
  <rect x="276" y="58" width="18" height="52" rx="9" fill="#6d28d9" transform="rotate(-8 285 84)"/>
  <!-- Pivot screw -->
  <circle cx="272" cy="104" r="12" fill="#4f46e5"/>
  <circle cx="272" cy="104" r="6" fill="#ede9fe"/>
  <!-- Blades -->
  <polygon points="254,122 272,144 290,122" fill="#c4b5fd"/>
  <!-- Blade detail -->
  <line x1="272" y1="122" x2="272" y2="144" stroke="#a78bfa" stroke-width="2"/>

  <!-- Sparkle at clip point -->
  <circle cx="102" cy="80" r="4.5" fill="#fbbf24"/>
  <line x1="102" y1="71" x2="102" y2="67" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="102" y1="89" x2="102" y2="93" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="93" y1="80" x2="89" y2="80" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="111" y1="80" x2="115" y2="80" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="96" y1="74" x2="93" y2="71" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="108" y1="86" x2="111" y2="89" stroke="#fbbf24" stroke-width="1.5"/>

  <text x="200" y="194" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6d28d9" opacity="0.6" font-weight="700" letter-spacing="1">NAIL TRIM</text>
</svg>
